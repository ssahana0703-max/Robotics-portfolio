[project]
name = "dataset"
version = "0.1.0"
description = "Dataset python environment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.2.0",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
]

[dependency-groups]
format = [
    "ruff>=0.14.7",
    "ty>=0.0.1a29",
]
test = ["pytest>=9.0.1", "pytest-cov>=7.0.0"]

[tool.pyright]
exclude = [".venv"]
venvPath = ".venv"
venv = "."

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu118"

[tool.ty.environment]
python = "./.venv"

[tool.ruff]
lint.ignore = ["F722"]

[tool.pytest.ini_options]
python_files = "test/test_*.py"
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

